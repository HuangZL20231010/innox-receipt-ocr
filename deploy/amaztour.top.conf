server {
    server_name amaztour.top www.amaztour.top;

    root /var/www/amaztour;
    index index.html;

    # PDF.js loads its worker as an ES module. Permit the www host to load it.
    location ~* \.mjs$ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zerolift.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zerolift.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.amaztour.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = amaztour.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name amaztour.top www.amaztour.top;
    return 404; # managed by Certbot
}
